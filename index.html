<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Process</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <section class="process-section">
    <h2 class="process-title">THE PROCESS</h2>
    <div class="process-underline"></div>
    <div class="process-steps">
      <div class="step">
        <div class="step-circle">01</div>
        <h3 class="step-name">BOOK YOUR CALL</h3>
        <p class="step-desc">Choose a time on the calendar above.</p>
      </div>
      <div class="step">
        <div class="step-circle">02</div>
        <h3 class="step-name">SPEAK WITH US</h3>
        <p class="step-desc">A 15-30 minute intro with our development team.</p>
      </div>
      <div class="step">
        <div class="step-circle">03</div>
        <h3 class="step-name">REVIEW FIT</h3>
        <p class="step-desc">We'll assess mutual alignment and territory.</p>
      </div>
      <div class="step">
        <div class="step-circle">04</div>
        <h3 class="step-name">NEXT STEPS</h3>
        <p class="step-desc">Move forward to FDD review and discovery.</p>
      </div>
    </div>
  </section>
</body>
</html>
